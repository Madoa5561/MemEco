<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ページが見つかりません — MemEco</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b111c" />
  <link rel="icon" href="/assets/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="/assets/style.css" />
  <style>
    .nf { min-height: 78vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 80px 24px; }
    .nf-code { font-family: var(--mono); font-size: 13px; letter-spacing: 0.3em; color: var(--mint); margin-bottom: 14px; }
    .nf h1 { font-size: clamp(28px, 5vw, 44px); letter-spacing: -0.03em; margin: 0 0 12px; }
    .nf p { color: var(--muted); margin: 0 0 28px; }
    .nf .btn { text-decoration: none; }
  </style>
</head>
<body>
  <main class="nf">
    <p class="nf-code">404 NOT FOUND</p>
    <h1>ページが見つかりません。</h1>
    <p>お探しのページは移動したか、存在しない可能性があります。</p>
    <a class="btn btn--primary" href="/">MemEco ホームへ戻る</a>
  </main>
</body>
</html>
